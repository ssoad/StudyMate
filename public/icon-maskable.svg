<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338ca" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <linearGradient id="capGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
    <linearGradient id="accentGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>

  <!-- Full square background for maskable boundary -->
  <rect width="512" height="512" fill="url(#bgGradMask)" />

  <!-- Center glyph scaled to fit safely within the 80% safe zone -->
  <g transform="translate(51.2, 51.2) scale(0.8)">
    <!-- Graduation Cap Main Diamond -->
    <polygon points="256,128 416,208 256,288 96,208" fill="url(#capGradMask)" />

    <!-- Under-cap skullcap -->
    <path d="M152,248 L152,324 C152,368 200,404 256,404 C312,404 360,368 360,324 L360,248 C332,272 296,286 256,286 C216,286 180,272 152,248 Z" fill="#ffffff" opacity="0.95" />

    <!-- Tassel -->
    <path d="M400,216 L400,336 C400,344 394,352 386,352 C378,352 372,344 372,336 L372,230" fill="none" stroke="url(#accentGradMask)" stroke-width="12" stroke-linecap="round" />
    <circle cx="386" cy="360" r="14" fill="#38bdf8" />

    <!-- Sparkle 1 -->
    <path d="M380,108 Q396,124 412,128 Q396,132 380,148 Q376,132 360,128 Q376,124 380,108 Z" fill="#38bdf8" />

    <!-- Sparkle 2 -->
    <path d="M112,140 Q124,152 136,155 Q124,158 112,170 Q109,158 97,155 Q109,152 112,140 Z" fill="#a5b4fc" />
  </g>
</svg>
