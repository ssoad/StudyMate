services:
  db:
    image: postgres:16-alpine
    container_name: study-mate-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: studymate
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
      - ./supabase/local_init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d studymate"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgrest:
    image: postgrest/postgrest:latest
    container_name: study-mate-postgrest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:mysecretpassword@db:5432/studymate
      PGRST_DB_SCHEMA: public
      PGRST_DB_ANON_ROLE: web_anon
      PGRST_JWT_SECRET: super-secret-jwt-token-with-at-least-32-characters-long

  study-mate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: study-mate
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      PORT: 5173
      STORAGE_DIR: /app/storage
      POSTGREST_URL: http://postgrest:3000
      JWT_SECRET: super-secret-jwt-token-with-at-least-32-characters-long
    volumes:
      - ./storage:/app/storage
    depends_on:
      - postgrest
      - db
